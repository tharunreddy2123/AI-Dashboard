services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: openshift-assistant-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # OpenShift Configuration
      - OPENSHIFT_API_URL=${OPENSHIFT_API_URL:-https://api.rm3.7wse.p1.openshiftapps.com:6443}
      - OPENSHIFT_TOKEN=${OPENSHIFT_TOKEN:-}
      
      # Ollama Configuration (using host Ollama container)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      
      # ChromaDB Configuration
      - CHROMA_PERSIST_DIR=/app/chroma_db
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # CORS Configuration
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
      
      # Environment
      - ENVIRONMENT=${ENVIRONMENT:-production}
      
      # Connection settings
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-2}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30}
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Removed ollama dependency - using external Ollama container

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: openshift-assistant-frontend
    ports:
      - "80:80"
    environment:
      - VITE_BACKEND_API_URL=/api
      - VITE_ENV=production
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama service (optional - can be external)
  ollama:
    image: ollama/ollama:latest
    container_name: openshift-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    # Uncomment if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  chroma_data:
    driver: local
  ollama_data:
    driver: local

networks:
  app-network:
    driver: bridge

